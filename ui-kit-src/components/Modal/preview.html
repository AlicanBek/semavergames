<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><title>Modal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap">
</head>
<body class="sg-stage sg-stage--stack">
<div class="sg-scrim">
  <div class="sg-modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <button class="sg-modal__close" aria-label="Kapat">×</button>
    <h2 class="sg-modal__title" id="m-title">Yanık oynamayı biliyor musun?</h2>
    <div class="sg-rule" aria-hidden="true"><span></span></div>
    <p class="sg-modal__body">İstersen önce kısa bir öğreticiyle başla.</p>
    <div class="sg-modal__actions">
      <button class="sg-btn sg-btn--secondary">Yanık Öğren</button>
      <button class="sg-btn">Hemen Oyna</button>
    </div>
  </div>
</div>
</body>
</html>
