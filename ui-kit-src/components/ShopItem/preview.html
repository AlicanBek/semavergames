<!-- @dsCard group="Surfaces" height=300 -->
<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><title>ShopItem</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap">
</head>
<body class="sg-stage">
<article class="sg-item">
  <h3 class="sg-item__name">Klasik</h3>
  <span class="sg-item__kind">Deste</span>
  <div class="sg-item__art"><span class="sg-cardback"></span></div>
  <span class="sg-item__state">Kullanılıyor</span>
  <button class="sg-btn sg-btn--confirm sg-btn--sm" disabled>Takılı</button>
</article>
<article class="sg-item">
  <h3 class="sg-item__name">Lacivert</h3>
  <span class="sg-item__kind">Deste</span>
  <div class="sg-item__art"><span class="sg-cardback" style="background:#22386b"></span></div>
  <span class="sg-item__price"><span class="sg-coin"></span>400</span>
  <button class="sg-btn sg-btn--sm">Satın Al</button>
</article>
<article class="sg-item">
  <h3 class="sg-item__name">Zümrüt</h3>
  <span class="sg-item__kind">Deste</span>
  <div class="sg-item__art"><span class="sg-cardback" style="background:#1f6b4a"></span></div>
  <span class="sg-item__state">Senin</span>
  <button class="sg-btn sg-btn--secondary sg-btn--sm">Tak</button>
</article>
</body>
</html>
