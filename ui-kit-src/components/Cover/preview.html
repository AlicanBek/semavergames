<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Semaver Games</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg-table); color:var(--text-on-dark); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:320px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:320px; overflow:hidden; }
  .art svg { display:block; width:480px; height:320px; }
  .red { fill:var(--action-primary); }
  .cream { fill:var(--surface-panel); }
  .night { fill:var(--surface-night); }
  .gold { fill:var(--trim-gold); }
  .heading { fill:var(--text-heading); }
  .blk { rx:var(--radius-lg); }
  .tile { rx:var(--radius-sm); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:84px; line-height:.95; font-weight:900; letter-spacing:-.02em; color:var(--text-on-dark); }
  .tag { margin:var(--space-3) 0 0 4px; font-size:14px; line-height:20px; font-weight:600; color:var(--text-on-dark-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 320" width="480" height="320">
<!--
  blocks      action-primary 144x272 bled off the top (the button red, largest) · surface-panel 136x184 (the cream panel) · surface-night 160x248 bleeding off the right edge · trim-gold 136x40 once (gold is trim, so it stays small) - about a third of 960x320
  arrangement one tall red slab with satellites, bottoms on one line space-6 above the edge, space-4 gutters
  pattern     the literal motif: cards dealt on a table. Card-proportioned tiles (20x28) at a space-8 pitch, cream on the red slab, heading red on the cream block, gold on the night block, a few left out like a hand being played
  scales      gutters space-4; pitch space-8; block corners radius-lg; tile corners radius-sm
-->
