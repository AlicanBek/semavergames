<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><title>RewardTile</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap">
</head>
<body class="sg-stage sg-stage--stack">
<div class="sg-rewards" style="padding-top:var(--space-2)">
<div class="sg-reward sg-reward--claimed"><span class="sg-reward__day">1. gün</span><span class="sg-check" aria-hidden="true">✓</span><span class="sg-reward__unit">Alındı</span></div>
<div class="sg-reward sg-reward--today"><span class="sg-reward__day">Bugün</span><span class="sg-coin sg-coin--lg"></span><span><span class="sg-reward__amount">1.000</span><br><span class="sg-reward__unit">para</span></span></div>
<div class="sg-reward"><span class="sg-reward__day">3. gün</span><span class="sg-coin sg-coin--lg"></span><span><span class="sg-reward__amount">2.000</span><br><span class="sg-reward__unit">para</span></span></div>
<div class="sg-reward"><span class="sg-reward__day">4. gün</span><span class="sg-coin sg-coin--lg"></span><span><span class="sg-reward__amount">4.000</span><br><span class="sg-reward__unit">para</span></span></div>
<div class="sg-reward"><span class="sg-reward__day">5. gün</span><span class="sg-coin sg-coin--lg"></span><span><span class="sg-reward__amount">8.000</span><br><span class="sg-reward__unit">para</span></span></div>
<div class="sg-reward"><span class="sg-reward__day">6. gün</span><span class="sg-coin sg-coin--lg" style="border-radius:var(--radius-sm)"></span><span><span class="sg-reward__amount">Yıldız</span><br><span class="sg-reward__unit">çerçeve</span></span></div>
<div class="sg-reward"><span class="sg-reward__day">7. gün</span><span class="sg-coin sg-coin--lg" style="border-radius:var(--radius-sm)"></span><span><span class="sg-reward__amount">Taç</span><br><span class="sg-reward__unit">çerçeve</span></span></div>
</div>
</body>
</html>
