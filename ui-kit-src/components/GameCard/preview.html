<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><title>GameCard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap">
</head>
<body class="sg-stage" style="padding-top:var(--space-6)">
<article class="sg-card">
  <h3 class="sg-card__title">Yanık</h3>
  <div class="sg-card__art" aria-hidden="true">♠</div>
  <p class="sg-card__sub">Hemen masaya otur</p>
  <button class="sg-btn sg-btn--hex">Oyna</button>
</article>
<article class="sg-card sg-card--night">
  <span class="sg-ribbon">Yeni</span>
  <h3 class="sg-card__title">Mağaza</h3>
  <div class="sg-card__art" aria-hidden="true">♦</div>
  <p class="sg-card__sub">Deste, masa, çerçeve</p>
  <button class="sg-btn sg-btn--ghost">Alışveriş</button>
</article>
<article class="sg-card sg-card--locked">
  <h3 class="sg-card__title">Katlamalı</h3>
  <div class="sg-card__art" aria-hidden="true">♣</div>
  <p class="sg-card__sub">5. seviyede açılır</p>
  <button class="sg-btn sg-btn--hex" disabled>5. Seviye</button>
</article>
</body>
</html>
