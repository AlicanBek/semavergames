<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Semaver Games | Online Kart ve Masa Oyunları</title>
  <meta name="description" content="Semaver Games: arkadaşlarınla ücretsiz online kart ve masa oyunları. İlk oyunumuz Yanık yayında, üyelik gerekmeden hemen oyna.">
  <link rel="canonical" href="https://semavergames.com/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Semaver Games">
  <meta property="og:description" content="Arkadaşlarınla ücretsiz online kart ve masa oyunları. İlk oyunumuz Yanık yayında.">
  <meta property="og:url" content="https://semavergames.com/">
  <meta property="og:locale" content="tr_TR">
  <style>
    :root { --bg: #0f2a22; --card: #17382e; --text: #f4efe4; --muted: #b9c7bf; --accent: #e0a23a; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: radial-gradient(1200px 600px at 50% -10%, #1d4a3c, var(--bg));
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 16px; text-align: center;
    }
    main { max-width: 560px; }
    .mark { font-size: 44px; line-height: 1; margin-bottom: 16px; }
    h1 { font-size: clamp(32px, 7vw, 48px); margin: 0 0 12px; letter-spacing: -0.02em; }
    p { color: var(--muted); font-size: 18px; line-height: 1.55; margin: 0 0 28px; }
    .game {
      background: var(--card); border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px; padding: 24px; text-align: left;
    }
    .game h2 { margin: 0 0 6px; font-size: 22px; }
    .game p { font-size: 16px; margin: 0 0 18px; }
    a.btn {
      display: inline-block; background: var(--accent); color: #1c1407;
      font-weight: 700; text-decoration: none; padding: 12px 22px; border-radius: 10px;
    }
    a.btn:hover, a.btn:focus-visible { filter: brightness(1.08); }
    footer { margin-top: 28px; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">♠ ♥ ♣ ♦</div>
    <h1>Semaver Games</h1>
    <p>Arkadaşlarınla ücretsiz online kart ve masa oyunları. Üyelik yok, bekleme yok, masayı kur ve oyna.</p>

    <section class="game">
      <h2>Yanık</h2>
      <p>İlk oyunumuz yayında. Linki arkadaşlarına gönder, hemen aynı masada oynayın.</p>
      <a class="btn" href="https://oyun.yanikmasasi.com/" target="_blank" rel="noopener">Yanık Oyna</a>
    </section>

    <footer>Yakında: 101, Tavla, Okey, Batak, Pişti</footer>
  </main>
  <script>
    document.querySelectorAll('a[target="_blank"]').forEach(function (a) {
      a.addEventListener('click', function (e) {
        var w = window.open(a.href, '_blank', 'noopener');
        if (w) e.preventDefault();
      });
    });
  </script>
</body>
</html>
