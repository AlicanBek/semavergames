<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Semaver Games | Online Kart ve Masa Oyunları</title>
  <meta name="description" content="Semaver Games: arkadaşlarınla ücretsiz online kart ve masa oyunları. İlk oyunumuz Yanık Masası yayında, üyelik gerekmeden hemen oyna.">
  <link rel="canonical" href="https://semavergames.com/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#17301f">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Semaver Games">
  <meta property="og:title" content="Semaver Games">
  <meta property="og:description" content="Arkadaşlarınla ücretsiz online kart ve masa oyunları. İlk oyunumuz Yanık Masası yayında.">
  <meta property="og:url" content="https://semavergames.com/">
  <meta property="og:image" content="https://semavergames.com/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="tr_TR">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;900&display=swap">
  <link rel="stylesheet" href="/ui-kit/tokens.css">
  <link rel="stylesheet" href="/ui-kit/components.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: radial-gradient(1100px 620px at 50% -8%, #24553a, var(--bg-table) 60%, var(--bg-table-deep));
      background-color: var(--bg-table);
      color: var(--text-on-dark);
      font-family: var(--font-sans);
      font-weight: 500;
      display: flex; flex-direction: column; align-items: center;
      padding: var(--space-8) var(--space-4) var(--space-6);
      min-height: 100vh;
    }
    main { width: 100%; max-width: 520px; display: flex; flex-direction: column; align-items: center; gap: var(--space-6); text-align: center; }
    .logo { width: min(260px, 70vw); height: auto; }
    h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .lead { margin: 0; font-size: 17px; line-height: 26px; color: var(--text-on-dark-muted); max-width: 34ch; text-wrap: balance; }
    .game {
      width: 100%; display: flex; flex-direction: column; align-items: center; gap: var(--space-4);
      padding: var(--space-6) var(--space-4);
      background: var(--surface-panel); color: var(--text-on-panel);
      border: 2px solid var(--trim-gold); border-radius: var(--radius-xl); box-shadow: var(--shadow-panel);
    }
    .game img { width: min(300px, 100%); height: auto; }
    .game p { margin: 0; font-size: 15px; line-height: 23px; font-weight: 600; max-width: 32ch; }
    .soon { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: var(--space-2); margin: 0; padding: 0; list-style: none; }
    .soon li { padding: 4px var(--space-3); border: 1px solid var(--trim-gold); border-radius: var(--radius-pill); font-size: 13px; line-height: 18px; font-weight: 600; color: var(--trim-gold-light); }
    .soon-title { margin: 0 0 var(--space-2); font-size: 13px; line-height: 18px; font-weight: 600; color: var(--text-on-dark-muted); }
    footer { margin-top: auto; padding-top: var(--space-8); font-size: 12px; line-height: 16px; color: var(--text-on-dark-muted); }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/assets/logo-stacked-on-dark.svg" alt="Semaver Games" width="260" height="179">
    <h1>Semaver Games</h1>
    <p class="lead">Arkadaşlarınla ücretsiz online kart ve masa oyunları. Üyelik yok, bekleme yok, masayı kur ve oyna.</p>

    <section class="game" aria-labelledby="yanik">
      <img src="/assets/game-yanik-masasi.svg" alt="Yanık Masası" id="yanik" width="300" height="105">
      <p>İlk oyunumuz yayında. Linki arkadaşlarına gönder, hemen aynı masada oynayın.</p>
      <a class="sg-btn sg-btn--hex sg-btn--lg" href="https://oyun.yanikmasasi.com/" target="_blank" rel="noopener">Yanık Oyna</a>
    </section>

    <div>
      <p class="soon-title">Yakında</p>
      <ul class="soon">
        <li>101</li><li>Tavla</li><li>Okey</li><li>Batak</li><li>Pişti</li>
      </ul>
    </div>
  </main>
  <footer>© 2026 Semaver Games</footer>
  <script src="/ui-kit/components.js"></script>
  <script>
    document.querySelectorAll('a[target="_blank"]').forEach(function (a) {
      a.addEventListener('click', function (e) {
        var w = window.open(a.href, '_blank', 'noopener');
        if (w) e.preventDefault();
      });
    });
  </script>
</body>
</html>
